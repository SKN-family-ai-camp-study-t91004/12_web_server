{% extends 'layout/base.html' %}

{% block content %}
<div class="container my-3">
    <h1>질문 목록</h1>
    <a class="btn btn-primary mb-3" href="{% url 'qna:question_create' %}">질문 등록</a>
    <table class="table">
        <thead><tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th></tr></thead>
        <tbody>
        {% for question in questions %}
            <tr>
                <td>{{ question.pk }}</td>
                <td><a href="{% url 'qna:question_detail' id=question.pk %}">{{ question.subject }}</a></td>
                <td>{{ question.author|default:'탈퇴한 사용자' }}</td>
                <td>{{ question.created_at|date:'Y-m-d H:i' }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="4">등록된 질문이 없다.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock content %}
