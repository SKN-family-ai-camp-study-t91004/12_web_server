{% extends "../layout/base.html" %}

{% block content %}
    <div class="container my-3">
        <h5 class="my-3 border-bottom pb-2">비밀번호 변경</h5>
        {# Django 폼이 현재 비밀번호와 새 비밀번호의 입력 오류를 함께 표시한다. #}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">저장</button>
            <a href="{% url 'qna:index' %}" class="btn btn-secondary">취소</a>
        </form>
    </div>
{% endblock content %}
